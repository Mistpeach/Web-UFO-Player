<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史版本 - UFO 波形控制器</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body { display: block; height: auto; min-height: 100vh; overflow-y: auto; padding: 40px 20px 60px; }
  .wrap { max-width: 860px; margin: 0 auto; }

  .page-head { text-align: center; margin-bottom: 10px; }
  .page-head h1 { font-size: 2.2rem; background: linear-gradient(135deg, #533483, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .page-head p { color: #888; font-size: 14px; line-height: 1.8; }
  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .btn-hero { padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none; border: 1px solid #0f3460; background: #16213e; color: #e0e0e0; }
  .btn-hero:hover { background: #0f3460; }
  .btn-hero.primary { background: linear-gradient(135deg, #533483, #a855f7); border: none; color: #fff; }
  .btn-hero.primary:hover { opacity: 0.85; }

  .ver-list { display: flex; flex-direction: column; gap: 14px; margin-top: 34px; }
  .ver-card { display: flex; align-items: center; gap: 18px; padding: 18px 22px; background: #16213e; border: 1px solid #0f3460; border-radius: 8px; text-decoration: none; color: inherit; transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease; }
  .ver-card:hover { background: #1a2540; border-color: #533483; transform: translateX(4px); }
  .ver-card:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
  .ver-card.latest { border-color: #533483; }
  .ver-main { flex: 1; min-width: 0; text-align: left; }
  .ver-title { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 1.35rem; font-weight: 600; color: #e0e0e0; margin-bottom: 6px; }
  .ver-badge { font-size: 11px; font-weight: 400; padding: 2px 9px; border-radius: 10px; background: linear-gradient(135deg, #533483, #a855f7); color: #fff; white-space: nowrap; }
  .ver-desc { font-size: 13px; color: #aaa; line-height: 1.6; word-break: break-word; }
  .ver-notes { font-size: 12px; color: #777; line-height: 1.6; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .ver-go { flex-shrink: 0; padding: 8px 18px; border-radius: 6px; font-size: 13px; border: 1px solid #0f3460; background: #1a1a2e; color: #e0e0e0; white-space: nowrap; transition: background 0.2s ease, border-color 0.2s ease; }
  .ver-card:hover .ver-go { background: #533483; border-color: #533483; color: #fff; }

  .empty { padding: 26px 24px; background: #16213e; border: 1px dashed #0f3460; border-radius: 8px; color: #aaa; font-size: 13px; line-height: 1.9; }
  .empty b { color: #a78bfa; }
  .empty code, .page-foot code { background: #1a1a2e; padding: 1px 6px; border-radius: 3px; color: #a78bfa; }
  .page-foot { margin-top: 34px; text-align: center; color: #666; font-size: 12px; line-height: 1.9; }

  @media (max-width: 560px) {
    body { padding: 26px 14px 44px; }
    .page-head h1 { font-size: 1.7rem; }
    .ver-card { flex-direction: column; align-items: stretch; gap: 12px; }
    .ver-card:hover { transform: none; }
    .ver-go { text-align: center; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="page-head">
    <h1>📜 历史版本</h1>
    <p>这里存放 UFO 波形控制器的各个历史版本，每张卡片对应一个版本。<br>点开卡片即可进入对应版本的控制界面。</p>
    <div class="btn-group">
      <a href="../WaveApp.html" class="btn-hero primary">▶ 进入最新版本</a>
      <a href="../../index.html" class="btn-hero">⬅ 返回首页</a>
    </div>
  </div>

  <div class="ver-list" id="verList"></div>

  <div class="page-foot">
    共 <span id="verCount">-</span> 个版本 · 版本清单由 <code>自动脚本</code> 自动生成
  </div>
</div>

<script src="versions.js"></script>
<script>
(function () {
  var list = document.getElementById('verList');
  var countEl = document.getElementById('verCount');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showHint(html) {
    list.innerHTML = '<div class="empty">' + html + '</div>';
    countEl.textContent = '0';
  }

  try {
    var versions = (window.UFO_VERSIONS && window.UFO_VERSIONS.length) ? window.UFO_VERSIONS : null;

    if (!versions) {
      showHint('还没有历史版本。<br>' +
        '在 <code>history/app/</code> 下新建版本文件夹（例如 <code>v1.0</code>），' +
        '放入该版本的页面文件和 <code>readme.txt</code>，' +
        '再运行 <code>history/gen_versions.ps1</code> 重新生成 <code>versions.js</code> 即可。');
      return;
    }

    list.innerHTML = versions.map(function (v) {
      var title = v.title || v.dir || '未命名版本';
      var url   = v.url || ('app/' + (v.dir || '') + '/app.html');
      var lines = String(v.desc || '').replace(/\r\n/g, '\n').split('\n');
      var lead  = (lines.shift() || '').replace(/\s+$/, '');
      var notes = lines.join('\n').replace(/^\s+|\s+$/g, '');

      return '<a class="ver-card' + (v.latest ? ' latest' : '') + '" href="' + esc(url) + '">' +
        '<div class="ver-main">' +
          '<div class="ver-title">' + esc(title) +
            (v.latest ? '<span class="ver-badge">最新版本</span>' : '') +
          '</div>' +
          (lead ? '<div class="ver-desc">' + esc(lead) + '</div>' : '') +
          (notes ? '<div class="ver-notes">' + esc(notes) + '</div>' : '') +
        '</div>' +
        '<span class="ver-go">进入 →</span>' +
      '</a>';
    }).join('');

    countEl.textContent = String(versions.length);
    console.log('历史版本渲染完成:', versions.length, '个');
  } catch (e) {
    console.log('历史版本渲染失败:', e);
    showHint('版本清单读取失败，请检查 <code>history/versions.js</code> 是否正常。');
  }
})();
</script>

</body>
</html>
