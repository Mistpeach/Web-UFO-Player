<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支持作者 - UFO Player</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: auto; text-align: center; }
  .hero { max-width: 700px; padding: 60px 20px 40px; }
  .hero h1 { font-size: 2.4rem; background: linear-gradient(135deg, #533483, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .hero p { color: #888; font-size: 15px; margin-bottom: 24px; }
  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-hero { padding: 12px 28px; border-radius: 6px; font-size: 15px; cursor: pointer; text-decoration: none; border: 1px solid #0f3460; background: #16213e; color: #e0e0e0; }
  .btn-hero:hover { background: #0f3460; }
  .btn-hero.primary { background: linear-gradient(135deg, #533483, #a855f7); border: none; color: #fff; }
  .btn-hero.primary:hover { opacity: 0.85; }

  /* Donate page specific */
  .donate-desc { color: #c0c0c0; font-size: 13px; line-height: 1.8; max-width: 560px; margin: 0 auto 28px; text-align: left; }
  .donate-desc b { color: #a78bfa; }
  .pay-tabs { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
  .pay-tab { padding: 8px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; border: 1px solid #0f3460; background: #16213e; color: #e0e0e0; }
  .pay-tab:hover { background: #0f3460; }
  .pay-tab.active { background: linear-gradient(135deg, #533483, #a855f7); border-color: transparent; color: #fff; }
  .qr-box { display: inline-block; background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 20px; }
  .qr-box img { width: 240px; height: 240px; object-fit: contain; display: block; border-radius: 4px; background: #fff; }
  .pay-tip { color: #888; font-size: 13px; margin-top: 14px; }
  .donate-footer { margin-top: 28px; color: #666; font-size: 12px; }
</style>
</head>
<body>

<div class="hero">
  <h1>💖 支持作者</h1>
  <p>如果 UFO Player 对你有帮助，欢迎投喂一杯咖啡</p>

  <div class="btn-group" style="margin-bottom: 28px;">
    <a href="index.html" class="btn-hero">⬅ 返回首页</a>
  </div>

  <div class="donate-desc">
    💌 <b>捐赠说明</b>：本项目完全<b>开源免费</b>，你的每一份支持都会用于
    <b>项目维护、域名续费、硬件测试与功能开发等</b>。捐赠完全是<b>自愿行为</b>，
    无论金额多少，都是对我继续维护更新的莫大鼓励。感谢你的信任与陪伴！
  </div>

  <div class="pay-tabs">
    <button class="pay-tab active" id="tabWx" onclick="switchPay('wx')">💚 微信</button>
    <button class="pay-tab" id="tabZfb" onclick="switchPay('zfb')">🧡 支付宝</button>
  </div>

  <div class="qr-box">
    <img id="qrImg" src="./res/wx.jpg" alt="收款码">
  </div>
  <div class="pay-tip" id="payTip">📱 请使用 <b>微信</b> 扫一扫上方二维码</div>

  <div class="donate-footer">
    再次感谢你的支持，愿每一个使用它的夜晚都顺利 🚀<br>
    
  </div>
</div>

<script>
function switchPay(type) {
  var img = document.getElementById('qrImg');
  var tip = document.getElementById('payTip');
  var tabWx = document.getElementById('tabWx');
  var tabZfb = document.getElementById('tabZfb');
  if (type === 'wx') {
    img.src = './res/wx.jpg';
    tip.innerHTML = '📱 请使用 <b>微信</b> 扫一扫上方二维码';
    tabWx.classList.add('active');
    tabZfb.classList.remove('active');
  } else {
    img.src = './res/zfb.png';
    tip.innerHTML = '📱 请使用 <b>支付宝</b> 扫一扫上方二维码';
    tabZfb.classList.add('active');
    tabWx.classList.remove('active');
  }
}
</script>
</body>
</html>
