<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ScriptPlayer-v2.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toolbar">
  <button id="btnDrawer" onclick="drawer_toggle()" aria-expanded="false" aria-controls="sidebar" title="展开 / 收起播放列表">☰ 播放列表</button>
  <button id="btnBLE" onclick="ble_connect()">🔵 连接蓝牙</button>
  <span id="bleLabel" class="badge off">未连接</span>
  <button id="btnFolder" onclick="folder_open()">📁 打开文件夹</button>
  <span id="folderLabel"></span>
  <button id="btnFlip" onclick="flip_toggle()" title="交换左右电机">🔀 交换左右电机</button>
  <a class="gh-link gh-in-toolbar" href="https://github.com/Mistpeach/Web-UFO-Player" target="_blank" rel="noopener" title="GitHub 仓库（新标签页打开）" aria-label="GitHub 仓库"><svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg></a>
</div>

<div id="layout">
  <div id="drawerBackdrop" onclick="drawer_close()"></div>
  <div id="sidebar" aria-hidden="true">
    <div id="drawerHeader">
      <span id="drawerTitle">📃 播放列表<span id="plCount"></span></span>
      <button id="drawerClose" onclick="drawer_close()" title="关闭播放列表（Esc）">✕ 关闭</button>
    </div>
    <div id="playlist"></div>
    <div id="drawerFoot">👆 点击列表项开始播放｜点遮罩、Esc 或「关闭」收起</div>
  </div>
  <div id="main">
    <div id="playerBox">
      <video id="player" controls hidden></video>
      <div id="subDisplay"></div>
      <div id="placeholder">📂 点击"打开文件夹"加载媒体</div>
    </div>
    <div id="statusBar">
      <div id="waveWrap"><canvas id="waveCanvas"></canvas><div id="wavePos"></div></div>
      <div id="timeText">00:00 / 00:00</div>
      <div id="actionText">未加载脚本</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
